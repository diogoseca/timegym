name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -e '.[dev]'
      - run: python tools/export_notebooks.py --check
      - run: python paper/build_standalone.py --check
      - run: python tools/sync_citation.py --check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python examples/quickstart.py
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -e '.[dev]' 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.11.4' 'scikit-learn==1.4.2' 'matplotlib==3.8.4'
      - run: python -m pytest
  installed-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install build 'twine>=6,<7'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"
      - run: python -I tools/smoke_installed.py --report wheel-report.json
      - run: python -I examples/reproduce_report.py wheel-report.json --require-same-environment
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: dist/*
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -e '.[docs]' pytest
      - run: python -m pytest -q tests/test_docs_hooks.py tests/test_docs_navigation.py
      - run: python -m mkdocs build --strict
      - run: python tools/check_site_links.py site
  research-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -r requirements-study.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m experiments.run_study --output /tmp/timegym-study
      - run: python -m experiments.run_supplement --output /tmp/timegym-supplement
      - name: Compare numerical records with frozen hashes
        run: |
          python -m experiments.compare_results --results /tmp/timegym-study/results.json --manifest experiments/results/manifest.json --report /tmp/timegym-pilot-hash.json --warn
          python -m experiments.compare_results --results /tmp/timegym-supplement/results.json --manifest experiments/results-v2/manifest.json --report /tmp/timegym-supplement-hash.json --warn
      - run: python -m experiments.run_followup --output /tmp/timegym-followup
      - run: python -m experiments.run_addendum --output /tmp/timegym-addendum
      # These check the statements the manuscript makes, not file hashes, so they fail the job.
      - name: Check the exploratory records' conclusions on the fresh runs
        run: |
          python - <<'PY'
          import json
          from experiments.render_addendum import check_addendum_conclusions
          from experiments.render_followup import check_followup_conclusions
          check_followup_conclusions(json.load(open("/tmp/timegym-followup/results.json")))
          check_addendum_conclusions(json.load(open("/tmp/timegym-addendum/results.json")))
          print("Follow-up (2.1) and addendum (2.2) conclusions hold on the fresh runs")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-linux-hashes
          path: /tmp/timegym-*-hash.json

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-study.txt
      - run: python -m pip install -e '.[notebooks]'
      - run: python tools/check_notebooks.py
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install LaTeX
        # cm-super supplies Type 1 T1 fonts; without it Metafont bitmap fonts fail to build.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-pictures texlive-fonts-recommended cm-super
      - name: Compile standalone manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build timegym.tex
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/build/timegym.pdf

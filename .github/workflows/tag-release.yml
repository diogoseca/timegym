name: Version and tag merged changes
# Every pull request merged into main runs this job. It counts the merged pull
# requests labelled `feature` or `fix` since the last release tag, writes the
# next major.features.fixes version, commits it to main, tags it and starts
# release.yml. Merges without those labels release nothing. A manual dispatch
# releases whatever is pending, or starts the next major version.
#
# The ruleset on main requires pull requests, so the push needs a bypass. With
# the RELEASE_DEPLOY_KEY secret set, the job pushes with that write deploy key
# (ruleset bypass: Deploy keys); otherwise it pushes with GITHUB_TOKEN, which
# needs its own bypass. See docs/release.md.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: Start the next major version (counters restart at 0)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Empty when the secret is unset; checkout then uses GITHUB_TOKEN.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,release]'
      - id: previous
        run: |
          echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: next
        env:
          MAJOR: ${{ inputs.major && '--major' || '' }}
        run: >-
          python tools/release_version.py --since '${{ steps.previous.outputs.tag }}'
          --apply $MAJOR --github-output "$GITHUB_OUTPUT"
      - name: Regenerate and check release metadata
        if: steps.next.outputs.release == 'true'
        env:
          RELEASE_TAG: v${{ steps.next.outputs.version }}
        run: |
          python tools/export_notebooks.py
          python tools/sync_citation.py
          python paper/build_standalone.py
          python tools/export_notebooks.py --check
          python tools/sync_citation.py --check --tag "$RELEASE_TAG"
          python paper/build_standalone.py --check
          python -m pytest -q tests/test_release_metadata.py tests/test_release_version.py
      - name: Commit, tag and start the release
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          BASE: ${{ steps.previous.outputs.base }}
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "TimeGym $VERSION"
          if ! git push --atomic origin HEAD:main "v$VERSION"; then
            # A merge that landed after checkout has its own run queued behind
            # this one. That run counts everything since the latest tag, so it
            # releases this version's changes too; this run steps aside.
            git fetch --quiet origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$BASE" ]; then
              echo "::notice::main moved past $BASE while this run prepared $VERSION; the run for the newer merge releases it."
              exit 0
            fi
            exit 1
          fi
          # Pushes made with GITHUB_TOKEN start no workflows, so start them here.
          # Deploy-key pushes start release.yml and pages.yml by themselves.
          if [ "$DEPLOY_KEY" != true ]; then
            gh workflow run release.yml --ref "v$VERSION"
            gh workflow run pages.yml --ref main
          fi

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[release]'
      - run: python tools/sync_citation.py --check --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/download-artifact@v4
        with:
          name: paper-pdf
          path: paper/build
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-paper
          path: |
            paper/build/timegym.pdf
            paper/timegym.tex
  authorize:
    # The pypi environment needs no reviewer click: a release publishes on its
    # own when the repository owner merged or approved its release pull request,
    # pushed the tag, or started or re-ran this run. Anyone else's merge stops
    # here, before PyPI. The environment's v* tag rule still limits publishing
    # to release tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check that the repository owner authorised this release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$ACTOR" = "$OWNER" ]; then
            echo "$OWNER started this run."
            exit 0
          fi
          PULLS=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            '.[] | select(.head.ref == "release" and .user.login == "github-actions[bot]" and .merged_at != null) | .number')
          for NUMBER in $PULLS; do
            if [ "$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.merged_by.login')" = "$OWNER" ]; then
              echo "$OWNER merged release pull request #$NUMBER."
              exit 0
            fi
            if gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq \
              ".[] | select(.user.login == \"$OWNER\" and .state == \"APPROVED\" and .commit_id == \"$SHA\") | .id" | grep -q .; then
              echo "$OWNER approved release pull request #$NUMBER at its release commit."
              exit 0
            fi
          done
          echo "::error::$TAG was not merged, approved, tagged or started by $OWNER, so it is not published. $OWNER can re-run this job to publish it."
          exit 1
  pypi:
    needs: [build, authorize]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/timegym
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-paper
          path: paper-artifacts
      - name: Publish versioned code and manuscript
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TimeGym $RELEASE_TAG" --generate-notes
          fi
          find paper-artifacts -type f -exec gh release upload "$RELEASE_TAG" --clobber {} +
          gh release upload "$RELEASE_TAG" --clobber dist/*
          gh release edit "$RELEASE_TAG" --draft=false

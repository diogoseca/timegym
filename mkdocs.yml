site_name: TimeGym
site_description: A gym for time series forecasting algorithms
site_author: Diogo Seca
repo_url: https://github.com/diogoseca/timegym
repo_name: diogoseca/timegym
edit_uri: ""
site_url: https://diogoseca.github.io/timegym/
theme:
  name: material
  features:
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
extra_css:
  - docs/stylesheets/extra.css
hooks:
  - tools/docs_hooks.py
plugins:
  - search
  - mkdocs-jupyter:
      include: ["notebooks/00_*.ipynb", "notebooks/2*.ipynb", "notebooks/3*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_bases: false
            show_if_no_docstring: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            summary: false
markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    anchors: warn
    unrecognized_links: warn
not_in_nav: |
  /notebooks/**/README.md
  /notebooks/archive/**
  /notebooks/0[1-9]_*.ipynb
  /notebooks/1[0-5]_*.ipynb
  /examples/**
  /experiments/**
  /paper/**
  /tools/**
nav:
  - Home: README.md
  - Tutorials:
      - Overview: docs/notebooks.md
      - Start:
          - Quick start: notebooks/00_quick_start.ipynb
      - Find what breaks:
          - Faults, repairs and replay: notebooks/23_faults_repairs_and_replay.ipynb
          - Write and test a custom model: notebooks/28_custom_model.ipynb
      - Shape the forecast:
          - Target transforms: notebooks/29_target_transforms.ipynb
          - Reductions: notebooks/30_reductions.ipynb
          - Multivariate forecasting: notebooks/21_multivariate_forecasting.ipynb
          - Real-data forecasts: notebooks/24_real_data_forecasts.ipynb
      - Measure uncertainty:
          - Univariate uncertainty: notebooks/20_univariate_uncertainty.ipynb
          - Multivariate uncertainty: notebooks/22_multivariate_uncertainty.ipynb
      - Stress-test:
          - Capability sweeps: notebooks/25_capability_sweeps.ipynb
          - Composed and financial stresses: notebooks/26_composed_and_financial_stresses.ipynb
          - Joint financial uncertainty: notebooks/27_joint_financial_uncertainty.ipynb
  - Concepts:
      - How TimeGym decides: docs/concepts/how-timegym-decides.md
      - Capability map: docs/concepts/capability-map.md
      - Synthetic scenarios: docs/stress-cases.md
  - API reference:
      - Overview: docs/reference.md
      - Tasks and forecasts: docs/api/tasks-and-forecasts.md
      - Scenarios and references: docs/api/scenarios.md
      - Composed and joint processes: docs/api/processes.md
      - Models and reductions: docs/api/models.md
      - Pipeline and reports: docs/api/pipeline.md
      - Scorecards and the scenario grid: docs/api/scorecard.md
      - Scores and diagnostics: docs/api/diagnostics.md
      - Fault fixtures: docs/api/fault-fixtures.md
      - Data preparation: docs/api/data-preparation.md
      - Market data: docs/api/market-data.md
  - Project:
      - Contributing: docs/contributing.md
      - Releasing: docs/release.md
      - Changelog: CHANGELOG.md

name: Release merged Python compatibility update
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  checks:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'automation/python-compatibility' &&
      contains(github.event.pull_request.labels.*.name, 'python-compatibility')
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
  tag:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[release]'
      - name: Validate and tag the new package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(python -c 'from timegym import __version__; print(__version__)')
          tag="v$version"
          python tools/sync_citation.py --check --tag "$tag"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; no publication requested."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA"
          gh workflow run release.yml --ref "$tag"

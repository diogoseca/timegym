site_name: TimeGym
site_description: A gym for time series forecasting algorithms
site_author: Diogo Seca
repo_url: https://github.com/diogoseca/timegym
repo_name: diogoseca/timegym
edit_uri: ""
site_url: https://diogoseca.github.io/timegym/
theme:
  name: material
  features:
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
extra_css:
  - docs/stylesheets/extra.css
hooks:
  - tools/docs_hooks.py
plugins:
  - search
  - mkdocs-jupyter:
      include: ["tutorials/[0-9][0-9]_*.ipynb", "examples/*.ipynb"]
      # Skip Markdown pages: with pandoc installed, reading each one as a notebook takes
      # time that doubles with every ::: line, minutes on the API pages.
      ignore: ["*.md"]
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_bases: false
            show_if_no_docstring: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            summary: false
markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    anchors: warn
    unrecognized_links: warn
not_in_nav: |
  /tutorials/README.md
  /source/**
  /docs/images/README.md
  /examples/README.md
  /examples/data/**
  /experiments/**
  /paper/**
  /tools/**
nav:
  - Home: README.md
  - Examples:
      - Overview: docs/examples.md
      - Demand and operations:
          - "Weekly shop sales: from forecast to stock order": examples/store-sales.ipynb
          - "Spare parts: the best score goes to a forecast of zero": examples/spare-parts.ipynb
          - "The Christmas order: five Decembers cannot pick the forecaster": examples/christmas-order.ipynb
          - "Call center staffing: forecast again at ten o'clock": examples/call-center.ipynb
          - "Train station riders: what is the weather worth, at best?": examples/station-riders.ipynb
          - "Daily births: how much history should a forecast learn from?": examples/daily-births.ipynb
      - Energy and environment:
          - "Tomorrow's electricity demand: let the worst days say what is missing": examples/electricity-demand.ipynb
          - "Solar farm output: a range for every half hour is not a range for the day": examples/solar-farm.ipynb
          - "River flow: checking the range, not only the forecast": examples/river-flow.ipynb
          - "Will it rain tomorrow? Score the forecast you already have": examples/rain.ipynb
          - "Tomorrow's temperature: which city should Sydney watch?": examples/daily-temperature.ipynb
          - "Tomorrow's air in London: the gaps someone filled in for you": examples/air-quality.ipynb
      - Chaotic but partly predictable:
          - "Flu season: the calendar knows the rhythm, not the peak": examples/flu-season.ipynb
          - "The sunspot cycle: how far ahead is a forecast worth making?": examples/sunspots.ipynb
          - "El Niño: how far ahead depends on the month you ask": examples/el-nino.ipynb
      - Web and product:
          - "A traffic jump: is this the new normal?": examples/traffic-jump.ipynb
          - "Site capacity: which forecast still works four weeks ahead?": examples/site-capacity.ipynb
      - Finance:
          - "Bitcoin: finding out you have nothing": examples/bitcoin.ipynb
          - "The S&P 500 next week: the direction and the size are different questions": examples/sp500.ipynb
      - Lessons that cut across domains:
          - The forest that cannot follow growth: examples/passenger-growth.ipynb
          - "You tried 50 models: is the winner real?": examples/best-of-fifty.ipynb
  - Tutorials:
      - Overview: docs/tutorials.md
      - Start:
          - Quick start: tutorials/01_quick_start.ipynb
          - Write and test a custom model: tutorials/02_custom_model.ipynb
      - Find what breaks:
          - Faults, repairs and replay: tutorials/03_faults_repairs_and_replay.ipynb
      - Shape the forecast:
          - Target transforms: tutorials/04_target_transforms.ipynb
          - Reductions: tutorials/05_reductions.ipynb
          - Multivariate forecasting: tutorials/06_multivariate_forecasting.ipynb
          - Real-data forecasts: tutorials/07_real_data_forecasts.ipynb
      - Measure uncertainty:
          - Univariate uncertainty: tutorials/08_univariate_uncertainty.ipynb
          - Multivariate uncertainty: tutorials/09_multivariate_uncertainty.ipynb
      - Stress-test:
          - Capability sweeps: tutorials/10_capability_sweeps.ipynb
          - Composed and financial stresses: tutorials/11_composed_and_financial_stresses.ipynb
          - Joint financial uncertainty: tutorials/12_joint_financial_uncertainty.ipynb
  - Concepts:
      - How TimeGym decides: docs/concepts/how-timegym-decides.md
      - Capability map: docs/concepts/capability-map.md
      - What TimeGym tests, and what it does not: docs/concepts/scope.md
      - Extend TimeGym: docs/concepts/extend.md
      - Synthetic scenarios: docs/stress-cases.md
      - Scenario equations: docs/scenario-equations.md
  - API reference:
      - Overview: docs/reference.md
      - Tasks and forecasts: docs/api/tasks-and-forecasts.md
      - Scenarios and references: docs/api/scenarios.md
      - Composed and joint processes: docs/api/processes.md
      - Models and reductions: docs/api/models.md
      - Pipeline and reports: docs/api/pipeline.md
      - Scorecards and the scenario grid: docs/api/scorecard.md
      - Scores and diagnostics: docs/api/diagnostics.md
      - Fault fixtures: docs/api/fault-fixtures.md
      - Data preparation: docs/api/data-preparation.md
  - Develop:
      - Contributing: docs/contributing.md
      - Releasing: docs/release.md
      - Changelog: CHANGELOG.md

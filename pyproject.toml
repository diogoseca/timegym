[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "timegym"
version = "0.2.0"
description = "Controlled verification and diagnosis for forecasting pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Diogo Seca"}]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
timegym = "timegym.cli:main"

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.4"]
plots = ["matplotlib>=3.8"]
features = ["tsfel", "tqdm"]
market-data = ["yfinance"]
dev = ["pytest>=8", "build>=1.2", "matplotlib>=3.8", "scikit-learn>=1.4", "nbdev==3.3.26", "nbformat>=5.10"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "matplotlib>=3.8", "scikit-learn>=1.4", "nbdev==3.3.26"]
docs = ["mkdocs>=1.6,<2"]
release = ["build>=1.2", "twine>=6,<7"]

[project.urls]
Repository = "https://github.com/diogoseca/timegym"
Issues = "https://github.com/diogoseca/timegym/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.flit.sdist]
include = ["tests/", "experiments/", "paper/", "docs/", "notebooks/", "tools/", "examples/", "requirements-study.txt", "lab.sh", "CITATION.cff", "CHANGELOG.md", "mkdocs.yml"]
exclude = ["paper/build/", "paper/*.pdf", "paper/__pycache__/", "notebooks/.ipynb_checkpoints/", "notebooks/html/", "tools/__pycache__/", "notebooks/__pycache__/"]

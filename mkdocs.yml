site_name: TimeGym v2
site_description: Controlled verification and diagnosis for forecasting pipelines
site_author: Diogo Seca
repo_url: https://github.com/diogoseca/timegym
site_url: https://diogoseca.github.io/timegym/
theme: readthedocs
hooks:
  - tools/docs_hooks.py
validation:
  links:
    anchors: warn
    unrecognized_links: warn
not_in_nav: |
  /notebooks/**
  /examples/**
  /experiments/**
  /paper/**
  /tools/**
  /CHANGELOG.md
nav:
  - Home: README.md
  - Command line: docs/cli.md
  - API contracts: docs/reference.md
  - Synthetic stress cases: docs/stress-cases.md
  - Jupyter tutorials: docs/notebooks.md
  - Migration: docs/migration.md
  - Contributing: docs/contributing.md
  - Validation record: docs/validation.md
  - Releases: docs/release.md
  - Publication strategy: docs/publication-strategy.md
  - Help: docs/help.md

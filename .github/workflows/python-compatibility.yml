name: Python compatibility proposal
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: python-compatibility-proposal
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15' # current-python
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install packaging
      - id: support
        run: python tools/update_python_support.py --apply --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.support.outputs.changed == 'true'
        with:
          python-version: ${{ steps.support.outputs.latest }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.support.outputs.changed == 'true'
        run: |
          python -m pip install -e '.[dev,docs,release,notebooks]'
          python tools/export_notebooks.py
          python -m pip install --no-deps -e .
          python tools/sync_citation.py
          python paper/build_standalone.py
          python -m pytest -q
          python tools/check_notebooks.py
          python examples/quickstart.py
          python -m mkdocs build --strict
          python -m build
          python -m twine check dist/*
      - uses: peter-evans/create-pull-request@v7
        if: steps.support.outputs.changed == 'true'
        with:
          branch: automation/python-compatibility
          title: Update Python support following pandas
          commit-message: Update Python support following pandas
          labels: python-compatibility,fix
          body: |
            Update the supported CPython range after a stable Python release and pandas wheel support.
            Synchronizes classifiers, requires-python, CI and documentation. It is labelled `fix`, so merging it adds one to the fix counter in the next release pull request.
            The proposal regenerated the exported package, the citation metadata and the standalone paper, and passed tests, notebooks, strict docs and distribution checks on the newest Python.
